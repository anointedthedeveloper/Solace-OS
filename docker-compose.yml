# One command production-like stack:  cp .env.example .env  # then edit the placeholders
#                                     docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solace
      POSTGRES_USER: solace
      POSTGRES_PASSWORD: ${SOLACE_DB_PASSWORD:?set SOLACE_DB_PASSWORD in .env}
    volumes:
      - solace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solace -d solace"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SOLACE_DB_URL: jdbc:postgresql://db:5432/solace
      SOLACE_DB_USER: solace
      SOLACE_DB_PASSWORD: ${SOLACE_DB_PASSWORD}
      # Set to true when the site is served over HTTPS (it should be). Use false only for plain-HTTP trials.
      SOLACE_COOKIE_SECURE: ${SOLACE_COOKIE_SECURE:-true}
      SOLACE_CORS_ALLOWED_ORIGINS: ${SOLACE_CORS_ALLOWED_ORIGINS:-}
      SOLACE_FILE_QUOTA_BYTES: ${SOLACE_FILE_QUOTA_BYTES:-104857600}
    expose: ["8080"]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [backend]
    ports:
      - "${SOLACE_HTTP_PORT:-8088}:80"

volumes:
  solace-db:
