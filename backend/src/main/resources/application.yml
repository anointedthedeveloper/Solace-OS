# Solace OS backend. Every deployment-specific value comes from an environment variable;
# nothing secret is committed. See ../../../.env.example and the README.
spring:
  application:
    name: solace-os-backend
  datasource:
    url: ${SOLACE_DB_URL:jdbc:postgresql://localhost:5432/solace}
    username: ${SOLACE_DB_USER:solace}
    password: ${SOLACE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${SOLACE_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway migrations
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${SOLACE_UPLOAD_MAX_FILE:10MB}
      max-request-size: ${SOLACE_UPLOAD_MAX_REQUEST:11MB}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SOLACE_PORT:8080}
  forward-headers-strategy: framework   # honour X-Forwarded-* from a trusted reverse proxy
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: ${SOLACE_SESSION_TIMEOUT:8h}
      cookie:
        name: SOLACE_SESSION
        http-only: true
        same-site: lax
        secure: ${SOLACE_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SOLACE_API_DOCS:false}
  swagger-ui:
    enabled: ${SOLACE_API_DOCS:false}

solace:
  # Comma-separated origins allowed to call the API cross-origin with credentials.
  # Leave empty when the frontend is served from the same origin (recommended).
  cors-allowed-origins: ${SOLACE_CORS_ALLOWED_ORIGINS:}
  cookie-secure: ${SOLACE_COOKIE_SECURE:true}
  bcrypt-strength: ${SOLACE_BCRYPT_STRENGTH:12}
  files:
    max-file-bytes: ${SOLACE_FILE_MAX_BYTES:10485760}       # 10 MiB per file
    quota-bytes: ${SOLACE_FILE_QUOTA_BYTES:104857600}       # 100 MiB per user
  rate-limit:
    login-per-ip: ${SOLACE_RL_LOGIN_PER_IP:20}              # attempts per window
    login-failures-per-user: ${SOLACE_RL_LOGIN_FAILS_PER_USER:5}
    register-per-ip: ${SOLACE_RL_REGISTER_PER_IP:5}
    window-seconds: ${SOLACE_RL_WINDOW_SECONDS:900}

logging:
  level:
    root: INFO
    app.solace: INFO
